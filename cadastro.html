```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de cadastro da TechVision.">
    <title>TechVision | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>TechVision</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Cadastro</h2>

            <p>
                Preencha o formulário abaixo para entrar em contato
                com a TechVision.
            </p>

            <form action="#" method="post">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <p>
                        <label for="nome">Nome completo:</label>
                        <input type="text"
                               id="nome"
                               name="nome"
                               autocomplete="name"
                               required
                               minlength="3">
                    </p>

                    <p>
                        <label for="email">E-mail:</label>
                        <input type="email"
                               id="email"
                               name="email"
                               autocomplete="email"
                               required>
                    </p>

                    <p>
                        <label for="nascimento">Data de nascimento:</label>
                        <input type="date"
                               id="nascimento"
                               name="nascimento"
                               required>
                    </p>

                    <p>
                        <label for="cpf">CPF:</label>
                        <input type="text"
                               id="cpf"
                               name="cpf"
                               inputmode="numeric"
                               pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                               placeholder="000.000.000-00"
                               title="Digite um CPF válido."
                               required>
                    </p>

                    <p>
                        <label for="telefone">Telefone:</label>
                        <input type="tel"
                               id="telefone"
                               name="telefone"
                               autocomplete="tel"
                               pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}"
                               placeholder="(83) 99999-9999"
                               title="Digite um telefone válido."
                               required>
                    </p>

                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <p>
                        <label for="endereco">Endereço:</label>
                        <input type="text"
                               id="endereco"
                               name="endereco"
                               autocomplete="street-address"
                               required>
                    </p>

                    <p>
                        <label for="cidade">Cidade:</label>
                        <input type="text"
                               id="cidade"
                               name="cidade"
                               autocomplete="address-level2"
                               required>
                    </p>

                    <p>
                        <label for="estado">Estado:</label>
                        <select id="estado"
                                name="estado"
                                autocomplete="address-level1"
                                required>
                            <option value="">Selecione</option>
                            <option value="PB">Paraíba</option>
                            <option value="PE">Pernambuco</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="CE">Ceará</option>
                            <option value="BA">Bahia</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                        </select>
                    </p>

                    <p>
                        <label for="cep">CEP:</label>
                        <input type="text"
                               id="cep"
                               name="cep"
                               inputmode="numeric"
                               autocomplete="postal-code"
                               pattern="[0-9]{5}-?[0-9]{3}"
                               placeholder="00000-000"
                               title="Digite um CEP válido."
                               required>
                    </p>

                </fieldset>

                <fieldset>
                    <legend>Informações profissionais</legend>

                    <p>
                        <label for="profissao">Área de atuação:</label>
                        <input type="text"
                               id="profissao"
                               name="profissao">
                    </p>

                    <p>
                        <label for="portfolio">Site ou portfólio:</label>
                        <input type="url"
                               id="portfolio"
                               name="portfolio"
                               placeholder="https://exemplo.com">
                    </p>

                    <p>
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem"
                                  name="mensagem"
                                  rows="5"
                                  maxlength="500"></textarea>
                    </p>

                </fieldset>

                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar formulário</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 TechVision. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
```
